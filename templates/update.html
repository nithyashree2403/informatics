{%extends "base.html" %}

{% block title %}Update Task{% endblock %}

{% block content %}
<div class="update-container">
  <div class="update-header">
    <h2>✏️ Update Task</h2>
    <p class="subtitle">Edit your task details below</p>
  </div>
  
  {%if error %}
  <div class="error-message">{{ error }}</div>
  {% endif %}
  
  <form method="POST" class="update-form">
    <div class="form-group">
      <label for="tittle">Task Title *</label>
      <input type="text" id="tittle" name="tittle" value="{{ task.tittle }}" required placeholder="Enter task title">
    </div>
    
    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description" rows="4" placeholder="Add details about your task...">{{ task.description }}</textarea>
    </div>
    
    <div class="form-row">
      <div class="form-group">
        <label for="priority">Priority</label>
        <select id="priority" name="priority">
          <option value="Low" {% if task.priority == 'Low' %}selected{% endif %}>🟢 Low</option>
          <option value="Medium" {% if task.priority == 'Medium' %}selected{% endif %}>🟡 Medium</option>
          <option value="High" {% if task.priority == 'High' %}selected{% endif %}>🔴 High</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="due_date">Due Date</label>
        <input type="date" id="due_date" name="due_date" value="{{ task.due_date.strftime('%Y-%m-%d') if task.due_date else '' }}">
      </div>
    </div>
    
    <div class="form-group checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" name="done" {% if task.done %}checked{% endif %}>
        <span>✓ Mark as completed</span>
      </label>
    </div>
    
    <div class="button-group">
      <button type="submit" class="btn-save">💾 Save Changes</button>
      <a href="{{ url_for('index') }}" class="btn-cancel">Cancel</a>
    </div>
  </form>
  
  <form method="POST" action="{{ url_for('delete', id=task.id) }}" onsubmit="return confirm('Are you sure you want to delete this task?');" style="margin-top: 20px;">
    <button type="submit" class="btn-delete">🗑️ Delete Task</button>
  </form>
</div>
{% endblock %}
